name: Session encryption tests

on:
  push:
    branches:
      - main
      - "feature/session-encryption"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Syntax check encrypted state
        run: node --check src/store.cjs && node --check src/main.cjs
      - name: Encryption behavior
        run: node --test test/session-encryption.test.cjs
      - name: Existing Store behavior
        run: node --test test/store.test.cjs
