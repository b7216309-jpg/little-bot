name: Grouped action tests

on:
  push:
    branches:
      - "feature/group-tool-actions"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Syntax check renderer
        run: node --check src/renderer/action-groups.js && node --check src/renderer/app.js
      - name: Grouped action tests
        run: node --test test/action-groups.test.cjs
