name: Chat slash command tests

on:
  push:
    branches:
      - "feature/chat-slash-commands"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Syntax check slash command changes
        run: node --check src/renderer/slash-commands.js && node --check src/renderer/app.js
      - name: Slash command parser
        run: node --test test/slash-commands.test.cjs
      - name: Electron local command interaction
        run: npx electron test/slash-commands-electron.cjs
