name: Task timing summary tests

on:
  push:
    branches:
      - "feature/task-timing-summary"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Syntax check timing changes
        run: node --check src/controller.cjs && node --check src/store.cjs && node --check src/renderer/app.js
      - name: Task timing behavior
        run: node --test test/task-timing-summary.test.cjs
