name: Apply Phase 5 provider protocol audit

on:
  push:
    branches:
      - feature/provider-usage-display
    paths:
      - .github/workflows/phase5-provider-audit.yml
      - scripts/apply-phase5-provider-audit.cjs
      - test/provider-usage-protocol.test.cjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/provider-usage-display
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply provider protocol corrections
        run: node scripts/apply-phase5-provider-audit.cjs
      - name: Remove one-shot patch files
        run: |
          rm scripts/apply-phase5-provider-audit.cjs
          rm .github/workflows/phase5-provider-audit.yml
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Run provider usage Node tests
        run: node --test test/provider-usage*.test.cjs
      - name: Run provider usage Electron fixture
        run: xvfb-run --auto-servernum npx electron test/provider-usage-electron.cjs
      - name: Commit tested provider protocol audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo 'The Phase 5 provider protocol audit produced no changes.'; exit 1; fi
          git commit -m "Harden provider usage protocol handling"
          git push origin HEAD:feature/provider-usage-display
