name: Local calendar tests

on:
  push:
    branches:
      - main
      - "feature/local-calendar"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Syntax check calendar changes
        run: node --check src/calendar.cjs && node --check src/store.cjs && node --check src/main.cjs && node --check src/agent-tools.cjs && node --check src/controller.cjs && node --check src/preload.cjs && node --check src/renderer/app.js
      - name: Calendar behavior
        run: node --test test/calendar.test.cjs
      - name: Electron calendar interaction
        run: npx electron test/calendar-electron.cjs
