name: llama.cpp namespace compatibility

on:
  push:
    branches:
      - "feature/llamacpp-namespace-tools"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Syntax check compatibility layer
        run: node --check src/responses-namespace-compat.cjs && node --check src/local-model-relay.cjs
      - name: Namespace mapper tests
        run: node --test test/responses-namespace-compat.test.cjs
      - name: Local relay round-trip test
        run: node --test test/local-model-relay-namespace.test.cjs
