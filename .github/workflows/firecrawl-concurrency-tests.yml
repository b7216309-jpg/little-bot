name: Firecrawl concurrency tests

on:
  push:
    branches:
      - main
      - "feature/firecrawl-concurrency"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Syntax check web services
        run: node --check src/web-services.cjs
      - name: Firecrawl concurrency behavior
        run: node --test test/web-services-concurrency.test.cjs
