name: Chat scroll tests

on:
  push:
    branches:
      - "feature/chat-scroll-stability"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Syntax check renderer files
        run: node --check src/renderer/chat-scroll.js && node --check src/renderer/app.js
      - name: Scroll logic tests
        run: node --test test/chat-scroll.test.cjs
      - name: Electron renderer scroll test
        run: npx electron test/chat-scroll-electron.cjs
