name: Apply Phase 1 polish

on:
  push:
    branches:
      - feature/independent-check
    paths:
      - .github/workflows/phase1-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/independent-check
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply final Independent Check polish
        run: node scripts/apply-independent-check-polish.cjs
      - name: Remove one-shot patch files
        shell: pwsh
        run: |
          Remove-Item -LiteralPath scripts/apply-independent-check-polish.cjs -Force
          Remove-Item -LiteralPath .github/workflows/phase1-polish.yml -Force
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Run Node test suite
        run: npm test
      - name: Run Electron integration tests
        run: npm run test:electron
      - name: Commit tested polish
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { throw 'The polish patch produced no changes.' }
          git commit -m "Polish Independent Check message eligibility"
          git push origin HEAD:feature/independent-check
