name: Editable system prompt tests

on:
  push:
    branches:
      - "feature/editable-system-prompt"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Syntax check system prompt integration
        run: node --check src/controller.cjs && node --check src/store.cjs && node --check src/renderer/app.js
      - name: System prompt behavior
        run: node --test test/system-prompt-settings.test.cjs
