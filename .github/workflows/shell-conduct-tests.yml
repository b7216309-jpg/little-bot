name: Shell conduct tests

on:
  push:
    branches:
      - "feature/shell-good-conduct"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Syntax check shell changes
        run: node --check src/shell-conduct.cjs && node --check src/controller.cjs && node --check src/goal-executor.cjs
      - name: Shell conduct behavior
        run: node --test test/shell-conduct.test.cjs
