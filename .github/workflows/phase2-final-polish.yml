name: Apply Phase 2 final polish

on:
  push:
    branches:
      - feature/in-process-events
    paths:
      - .github/workflows/phase2-final-polish.yml
      - scripts/apply-phase2-final-polish.cjs

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/in-process-events
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply foreground event polish
        run: node scripts/apply-phase2-final-polish.cjs
      - name: Remove one-shot patch files
        shell: pwsh
        run: |
          Remove-Item -LiteralPath scripts/apply-phase2-final-polish.cjs -Force
          Remove-Item -LiteralPath .github/workflows/phase2-final-polish.yml -Force
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Run Node test suite
        run: npm test
      - name: Run Electron integration tests
        run: npm run test:electron
      - name: Commit tested final polish
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { throw 'The final polish produced no changes.' }
          git commit -m "Polish foreground event semantics"
          git push origin HEAD:feature/in-process-events
