name: Apply Phase 3 documentation

on:
  push:
    branches:
      - feature/plan-evidence-ledger
    paths:
      - .github/workflows/phase3-docs.yml
      - scripts/apply-phase3-docs.cjs
      - scripts/repair-phase3-doc-tests.cjs
      - LEDGER.md

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/plan-evidence-ledger
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Apply documentation and bundled-guide migration
        run: node scripts/apply-phase3-docs.cjs
      - name: Update retained documentation assertions
        run: node scripts/repair-phase3-doc-tests.cjs
      - name: Remove one-shot patch files
        shell: pwsh
        run: |
          Remove-Item -LiteralPath scripts/apply-phase3-docs.cjs -Force
          Remove-Item -LiteralPath scripts/repair-phase3-doc-tests.cjs -Force
          Remove-Item -LiteralPath .github/workflows/phase3-docs.yml -Force
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Run Node test suite
        run: npm test
      - name: Run Electron integration tests
        run: npm run test:electron
      - name: Commit tested documentation
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if (git diff --cached --quiet) { throw 'The Phase 3 documentation patch produced no changes.' }
          git commit -m "Document the goal plan and evidence ledger"
          git push origin HEAD:feature/plan-evidence-ledger
