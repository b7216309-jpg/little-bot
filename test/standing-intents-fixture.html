<!doctype html>
<html><head><meta charset="utf-8"><title>Standing intents fixture</title></head>
<body>
  <section id="automations-view"><div id="automations-list"></div></section>
  <script>
    const fixtureState = {
      standingIntents: { intents: [] },
      eventRuntime: { status: 'running', bus: { queued: 0 }, standingIntentCount: 0, enabledStandingIntentCount: 0 },
      autonomy: { goals: [{ id: 'goal-1', name: 'Review report', authorized: true }] },
      automations: [{ id: 'automation-1', name: 'Daily report', authorized: true }],
    };
    window.bot = {
      getState: async () => fixtureState,
      onEvent: () => () => {},
      saveStandingIntent: async payload => {
        window.__savedIntent = payload;
        fixtureState.standingIntents.intents = [{ ...payload, id: 'intent-1', createdAt: 1, updatedAt: 1, triggerCount: 0, lastStatus: 'never' }];
        fixtureState.eventRuntime.standingIntentCount = 1;
        fixtureState.eventRuntime.enabledStandingIntentCount = payload.enabled ? 1 : 0;
        return fixtureState;
      },
      deleteStandingIntent: async () => fixtureState,
      toggleStandingIntent: async () => fixtureState,
    };
  </script>
  <script src="../src/renderer/standing-intents-ui.js"></script>
  <script src="../src/renderer/standing-intents-panel.js"></script>
</body></html>
